start_4: "🎄 <b>အထူးအဖွဲ့လိုအပ်သည်</b> 🎄 ကျေးဇူးပြု၍ သင့် <b>အဖွဲ့</b> ကို <b>အထူးအဖွဲ့</b> သို့ ပြောင်းလဲပြီး ပြန်လည်ထည့်ပါ။ <b>အထူးအဖွဲ့ ပြုလုပ်နည်း</b> - သင့်အဖွဲ့၏ စကားဝိုင်းမှတ်တမ်းကို <b>မြင်သာစေရန်</b> ပြောင်းပါ။"
start_5: "<b>↝ မှတ်ပုံတင်အနုတ်လက္ခဏာရှိသော စကားဝိုင်း ↜</b> ဤစကားဝိုင်းသည် {0} ဒေတာဘေ့စ်တွင် မှတ်ပုံတင်အနုတ်လက္ခဏာရှိပါသည်။ <a href={1}>sudo အသုံးပြုသူ</a> ကို တောင်းဆိုပြီး သင့်စကားဝိုင်းကို ဖြေရှင်းပါ၊ သို့မဟုတ် <a href={2}>ထောက်ခံမှု စကားဝိုင်း</a> ကို သွားပါ။"
start_6: "😲 <b>သီချင်း အချက်အလက်</b> 😲 📌 <b>ခေါင်းစဉ် :</b> {0} ⏳ <b>အချိန်ကာလ :</b> {1} မိနစ် 👀 <b>ကြည့်ရှုသူ :</b> <code>{2}</code> ⏰ <b>ထုတ်ပြန်သည့် ရက်စွဲ :</b> {3} 📎 <b>ချန်နယ် :</b> <a href={4}>{5}</a> <u><b>🥀 ရှာဖွေရေးစွမ်းအား {6} မှ ဖြစ်ပါသည်။</b></u>"

